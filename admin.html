<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf7e9"><title>VITA — Товары</title>
<style>
:root{color-scheme:light;--green:#24563e;--dark:#183d2b;--cream:#fbf7e9;--line:#e7dfc8}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--cream);color:#202820;font:16px/1.45 Arial,sans-serif}
main{max-width:760px;margin:auto}h1{font-size:25px;color:var(--dark)}h2{font-size:20px;color:var(--dark)}
section,.item{background:#fffdf7;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #2347340c}
label{display:block;margin:12px 0 5px;font-weight:700;color:var(--dark)}
input,button{width:100%;min-height:46px;padding:11px 12px;border:1px solid #d9dfcf;border-radius:10px;font:inherit}
button{background:var(--green);color:white;border:0;font-weight:700;cursor:pointer;margin:7px 0}
button:disabled{opacity:.55}button.secondary{background:#68766d}button.danger{background:#a23838}
.hidden{display:none!important}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.help,#status,#message{font-size:14px;color:#59695a;overflow-wrap:anywhere}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px}.item p{margin:3px 0;color:#68766d;font-size:14px}.item-actions{display:flex;gap:6px;min-width:116px}.item-actions button{padding:8px 5px;font-size:13px}
.photo-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.photo-entry{min-width:0;padding:7px;border:1px solid var(--line);border-radius:10px}
.photo-entry img{width:100%;aspect-ratio:1;object-fit:contain;background:#f5f2e7;border-radius:7px}
.photo-entry button{font-size:12px;padding:7px 3px;min-height:38px}
@media(max-width:430px){body{padding:9px}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.photo-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head><body><main>
<h1>VITA — Редактор товаров</h1>
<section id="login"><form id="loginForm">
<label for="email">Электронная почта</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn">Войти</button></form><p id="message" role="status">Запуск редактора…</p></section>
<div id="app" class="hidden"><button id="logout" class="secondary" type="button">Выйти</button>
<section><h2 id="formTitle">Добавить товар</h2><form id="productForm">
<label for="code">Код товара *</label><input id="code" maxlength="120" required placeholder="Например: bd 45.42.403">
<label for="name">Название товара *</label><input id="name" maxlength="200" required>
<label for="price">Цена *</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" required>
<label for="photo">Фотографии (можно выбрать несколько)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<p class="help">Фото автоматически уменьшаются перед загрузкой. Можно убрать старые и добавить новые.</p>
<div id="formPhotos" class="photo-list"></div>
<div class="row"><button id="save" type="submit">Сохранить</button><button id="cancel" class="secondary" type="button">Отмена</button></div>
</form><p id="status" role="status" aria-live="polite"></p></section>
<h2>Список товаров</h2><button id="refresh" type="button">Обновить список</button><div id="products"></div><button id="more" class="secondary hidden" type="button">Загрузить ещё</button>
</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), say=(id,t)=>$(id).textContent=t;
const URL_DB="https://yedkbzasynqitvbavwwd.supabase.co", KEY="sb_publishable_lV5KW7THtDzy-SN9GTrHLg_z7AFMqUP", BUCKET="product-images";
const PAGE=40, MAX=5*1024*1024;let db,items=[],offset=0,editing=null,oldImages=[],keptImages=[],saving=false;
const paths=p=>Array.isArray(p.images)&&p.images.length?p.images:(p.image_url?[p.image_url]:[]);
async function removeUnreferenced(candidates){const {data,error}=await db.from('products').select('images,image_url');if(error)throw error;const used=new Set();for(const p of data||[])for(const path of paths(p))used.add(path);const removable=candidates.filter(path=>!/^https?:\/\//i.test(path)&&!used.has(path));if(removable.length){const {error:removeError}=await db.storage.from(BUCKET).remove(removable);if(removeError)throw removeError}return removable.length}
function show(session){$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session)load(true)}
async function login(e){e.preventDefault();$('loginBtn').disabled=true;say('message','Выполняется вход…');try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;show(data.session);say('message','')}catch(e){say('message','Ошибка входа: '+e.message)}finally{$('loginBtn').disabled=false}}
async function signed(path){if(/^https?:\/\//i.test(path))return path;const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);if(!error&&data?.signedUrl)return data.signedUrl;const pub=db.storage.from(BUCKET).getPublicUrl(path);return pub.data?.publicUrl||''}
async function load(reset=false){if(reset){offset=0;items=[];$('products').replaceChildren()}$('refresh').disabled=true;$('more').disabled=true;try{const {data,error}=await db.from('products').select('id,name,price,images,image_url').order('name').range(offset,offset+PAGE-1);if(error)throw error;const batch=data||[];items=reset?batch:[...items,...batch];offset+=batch.length;renderList();$('more').classList.toggle('hidden',batch.length<PAGE)}catch(e){$('products').textContent='Ошибка загрузки: '+e.message}finally{$('refresh').disabled=false;$('more').disabled=false}}
function renderList(){const host=$('products');host.replaceChildren();if(!items.length){host.textContent='Товаров пока нет.';return}for(const p of items){const card=document.createElement('div');card.className='item';const info=document.createElement('div');const b=document.createElement('b');b.textContent=p.name||'Без названия';const detail=document.createElement('p');detail.textContent='Код: '+p.id+' · Цена: '+p.price;info.append(b,detail);const actions=document.createElement('div');actions.className='item-actions';const edit=document.createElement('button');edit.type='button';edit.textContent='Изменить';edit.onclick=()=>editItem(p);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Удалить';del.onclick=()=>removeItem(p);actions.append(edit,del);card.append(info,actions);host.append(card)}}
async function renderPhotos(){const host=$('formPhotos');host.replaceChildren();for(const path of keptImages){const box=document.createElement('div');box.className='photo-entry';const img=document.createElement('img');img.alt='Фото товара';img.loading='lazy';signed(path).then(url=>{if(url)img.src=url});const btn=document.createElement('button');btn.type='button';btn.className='danger';btn.textContent='Убрать';btn.onclick=()=>{keptImages=keptImages.filter(x=>x!==path);renderPhotos()};box.append(img,btn);host.append(box)}}
function editItem(p){editing=p.id;oldImages=paths(p);keptImages=[...oldImages];$('code').value=p.id;$('code').readOnly=true;$('name').value=p.name||'';$('price').value=p.price??'';$('photo').value='';$('formTitle').textContent='Изменить товар';say('status','Код существующего товара сохранён без изменений.');renderPhotos();window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){$('productForm').reset();editing=null;oldImages=[];keptImages=[];$('code').readOnly=false;$('formTitle').textContent='Добавить товар';$('formPhotos').replaceChildren();say('status','')}
async function compress(file){if(file.size>MAX)throw new Error('Фото '+file.name+' больше 5 МБ.');if(!('createImageBitmap'in window))return file;let bitmap;try{bitmap=await createImageBitmap(file)}catch(_){return file}const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.82));if(!blob)return file;return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'photo')+'.webp',{type:'image/webp'})}
async function save(e){e.preventDefault();if(saving)return;const code=$('code').value.trim(),name=$('name').value.trim(),priceText=$('price').value.trim(),price=Number(priceText);if(!code||!name||priceText===''||!Number.isFinite(price)||price<0){say('status','Проверь код, название и цену.');return}const files=Array.from($('photo').files||[]);if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type))){say('status','Разрешены только JPEG, PNG и WebP.');return}saving=true;$('save').disabled=$('cancel').disabled=true;say('status','Сжимаю и сохраняю…');const uploaded=[];try{for(const original of files){const file=await compress(original);const ext=file.type==='image/webp'?'webp':file.type==='image/png'?'png':'jpg';const path=crypto.randomUUID()+'.'+ext;const {data,error}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;uploaded.push(data.path)}const images=[...keptImages,...uploaded];const row={id:code,name,price,images,image_url:images[0]||null};const result=editing!==null?await db.from('products').update(row).eq('id',editing).select('id'):await db.from('products').insert(row).select('id');if(result.error)throw result.error;if(!result.data?.length)throw new Error('Запись не подтверждена. Проверь права доступа RLS.');const removed=oldImages.filter(x=>!images.includes(x));if(removed.length){try{await removeUnreferenced(removed)}catch(cleanupError){say('status','Товар сохранён, но часть старых фото не удалось очистить: '+cleanupError.message)}}clearForm();say('status','Товар сохранён.');await load(true)}catch(e){if(uploaded.length)await db.storage.from(BUCKET).remove(uploaded);say('status','Ошибка: '+(e.message||'Неизвестная ошибка'))}finally{saving=false;$('save').disabled=$('cancel').disabled=false}}
async function removeItem(p){if(!confirm('Удалить товар «'+p.name+'» и его фотографии?'))return;try{const {data,error}=await db.from('products').delete().eq('id',p.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Товар не удалён. Проверь RLS.');const photos=paths(p);if(photos.length){try{await removeUnreferenced(photos)}catch(storageError){alert('Товар удалён, но часть фотографий осталась в хранилище: '+storageError.message)}}if(editing===p.id)clearForm();say('status','Товар удалён.');await load(true)}catch(e){alert('Ошибка удаления: '+e.message)}}
async function start(){if(!window.supabase){say('message','Не загрузилась библиотека Supabase.');return}try{db=window.supabase.createClient(URL_DB,KEY);$('loginForm').addEventListener('submit',login);$('productForm').addEventListener('submit',save);$('cancel').onclick=clearForm;$('refresh').onclick=()=>load(true);$('more').onclick=()=>load(false);$('logout').onclick=async()=>{await db.auth.signOut();clearForm();show(null);say('message','Вы вышли из аккаунта.')};const {data,error}=await db.auth.getSession();if(error)throw error;show(data.session);if(!data.session)say('message','Введи почту и пароль.')}catch(e){say('message','Ошибка запуска: '+e.message)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
