<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITA — редактор товаров</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font:16px Arial,sans-serif;max-width:850px;margin:20px auto;padding:16px;background:#faf6ee;color:#244432}
h1{color:#24553e}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
button{background:#24553e;color:white;border:0;cursor:pointer}
.card{background:white;padding:14px;margin:12px 0;border-radius:12px}
img{max-width:130px;max-height:130px;object-fit:contain}
.hidden{display:none}.danger{background:#a83232}
</style>
</head>
<body>
<h1>VITA — редактор товаров</h1>
<section id="login" class="card">
<h3>Вход директора</h3>
<input id="email" type="email" placeholder="Электронная почта">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn">Войти</button>
<p id="loginMsg"></p>
</section>
<section id="app" class="hidden">
<button id="logoutBtn">Выйти</button>
<h2 id="formTitle">Добавить товар</h2>
<div class="card">
<input id="name" placeholder="Название товара">
<input id="variant" placeholder="Вариант">
<input id="price" type="number" min="0" step="0.01" placeholder="Цена">
<input id="pack" placeholder="Упаковка">
<input id="category" placeholder="Категория">
<textarea id="note" placeholder="Примечание"></textarea>
<label>Фотография товара</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<button id="saveBtn">Сохранить товар</button>
<button id="cancelBtn">Отменить редактирование</button>
<p id="msg"></p>
</div>
<h2>Товары</h2>
<button id="refreshBtn">Обновить список</button>
<div id="products"></div>
</section>
<script>
const SUPABASE_URL='https://yedkbzasynqitvbavwwd.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_lV5KW7THtDzy-SN9GTrHLg_z7AFMqUP';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let editingId=null;

const $=id=>document.getElementById(id);
$('loginBtn').onclick=login;
$('logoutBtn').onclick=logout;
$('saveBtn').onclick=saveProduct;
$('cancelBtn').onclick=clearForm;
$('refreshBtn').onclick=loadProducts;

async function login(){
 $('loginMsg').textContent='Выполняю вход…';
 const {error}=await db.auth.signInWithPassword({
  email:$('email').value.trim(),password:$('password').value
 });
 $('loginMsg').textContent=error?'Ошибка входа: '+error.message:'';
 if(!error)await start();
}
async function logout(){await db.auth.signOut();location.reload()}
async function start(){
 const {data:{session}}=await db.auth.getSession();
 $('login').classList.toggle('hidden',!!session);
 $('app').classList.toggle('hidden',!session);
 if(session)await loadProducts();
}
function clearForm(){
 editingId=null;
 ['name','variant','price','pack','category','note','photo'].forEach(id=>$(id).value='');
 $('formTitle').textContent='Добавить товар';
 $('msg').textContent='';
}
function editProduct(p){
 editingId=p.id;
 ['name','variant','price','pack','category','note'].forEach(k=>$(k).value=p[k]??'');
 $('formTitle').textContent='Изменить товар';
 $('msg').textContent='Выбрано: '+p.name+'. Чтобы заменить фото, выбери новый файл.';
 window.scrollTo({top:0,behavior:'smooth'});
}
async function saveProduct(){
 const msg=$('msg');
 const name=$('name').value.trim();
 const rawPrice=$('price').value;
 const price=Number(rawPrice);
 if(!namerawPrice===''!Number.isFinite(price)||price<0){
  msg.textContent='Укажи название и правильную цену.';return;
 }
 msg.textContent='Сохраняю…';
 const row={
  name,variant:$('variant').value.trim()||null,price,
  pack:$('pack').value.trim()||null,
  category:$('category').value.trim()||null,
  note:$('note').value.trim()||null};
 const file=$('photo').files[0];
 if(file){
  if(file.size>5*1024*1024){msg.textContent='Фото должно быть до 5 МБ.';return;}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
   msg.textContent='Разрешены JPG, PNG, WEBP.';return;
  }
  const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1];
  const path=crypto.randomUUID()+'.'+ext;
  const {error}=await db.storage.from('product-images').upload(path,file);
  if(error){msg.textContent='Ошибка загрузки фото: '+error.message;return;}
  row.image_url=path;
 }
 let result;
 if(editingId)result=await db.from('products').update(row).eq('id',editingId);
 else result=await db.from('products').insert(row);
 if(result.error){msg.textContent='Ошибка базы: '+result.error.message;return;}
 msg.textContent='Сохранено.';
 clearForm();
 await loadProducts();
}
async function loadProducts(){
 const box=$('products');box.textContent='Загружаю…';
 const {data,error}=await db.from('products').select('*').order('name');
 if(error){box.textContent='Ошибка загрузки: '+error.message;return;}
 box.replaceChildren();
 for(const p of data){
  const card=document.createElement('div');card.className='card';
  const title=document.createElement('h3');title.textContent=p.name||'(без названия)';card.append(title);
  const info=document.createElement('p');info.textContent='Цена: '+p.price+' · Категория: '+(p.category||'—');card.append(info);
  if(p.image_url){
   const {data:img}=await db.storage.from('product-images').createSignedUrl(p.image_url,3600);
   if(img?.signedUrl){const im=document.createElement('img');im.src=img.signedUrl;im.alt='Фото товара';card.append(im);}
  }
  const edit=document.createElement('button');edit.textContent='Изменить';edit.onclick=()=>editProduct(p);card.append(edit);
  const del=document.createElement('button');del.textContent='Удалить товар';del.className='danger';
  del.onclick=async()=>{
   if(!confirm('Удалить товар «'+p.name+'»?'))return;
   const {error}=await db.from('products').delete().eq('id',p.id);
   if(error)alert('Не удалось удалить: '+error.message);
   else await loadProducts();
  };
  card.append(del);box.append(card);
 }
}
start();
</script>
</body>
</html>
