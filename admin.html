<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITA — Редактор</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5ed;color:#234734;font:16px Arial,sans-serif}
main{max-width:850px;margin:auto;padding:18px}
h1{color:#20543a}
section,.item{background:white;padding:18px;border-radius:16px;margin:14px 0}
input,textarea,button{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font:inherit}
button{background:#24563e;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
.danger{background:#a83b3b}
.hidden{display:none}
img{width:110px;height:110px;object-fit:contain}
small{color:#666}
#status,#loginStatus{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>VITA — Редактор товаров</h1>

<section id="login">
<h2>Вход</h2>
<input id="email" type="email" placeholder="Электронная почта">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn">Войти</button>
<p id="loginStatus">Подключение...</p>
</section>

<div id="app" class="hidden">
<button id="logoutBtn">Выйти</button>
<section>
<h2 id="heading">Добавить товар</h2>
<input id="name" placeholder="Название">
<input id="variant" placeholder="Вариант">
<input id="price" type="number" min="0" step="0.01" placeholder="Цена">
<input id="pack" placeholder="Упаковка">
<input id="category" placeholder="Категория">
<textarea id="note" placeholder="Описание"></textarea>
<label>Фотография товара</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<small>JPG, PNG, WEBP — до 5 МБ</small>
<button id="saveBtn">Сохранить товар</button>
<button id="cancelBtn">Отменить редактирование</button>
<p id="status"></p>
</section>
<h2>Список товаров</h2>
<button id="refreshBtn">Обновить список</button>
<div id="products"></div>
</div>
</main>

<script>
const URL_DB="https://yedkbzasynqitvbavwwd.supabase.co";
const KEY="sb_publishable_lV5KW7THtDzy-SN9GTrHLg_z7AFMqUP";
const $=id=>document.getElementById(id);
let db,editing=null,items=[];

function msg(id,text){$(id).textContent=text}
function err(e){return e?.message||String(e)}

function show(session){
$("login").classList.toggle("hidden",!!session);
$("app").classList.toggle("hidden",!session);
if(session)loadProducts();
else msg("loginStatus","Введи почту и пароль.");
}

async function login(){
$("loginBtn").disabled=true;
msg("loginStatus","Выполняется вход...");
try{
const {data,error}=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});
if(error)throw error;
show(data.session);
}catch(e){msg("loginStatus","Ошибка: "+err(e))}
finally{$("loginBtn").disabled=false}
}

async function logout(){
await db.auth.signOut();
show(null);
}

function clearForm(){
editing=null;
["name","variant","price","pack","category","note","photo"]
.forEach(id=>$(id).value="");
$("heading").textContent="Добавить товар";
$("saveBtn").textContent="Сохранить товар";
msg("status","");
}

function editProduct(id){
const p=items.find(x=>String(x.id)===String(id));
if(!p)return;
editing=p.id;
["name","variant","price","pack","category","note"]
.forEach(k=>$(k).value=p[k]??"");
$("photo").value="";
$("heading").textContent="Изменить товар";
$("saveBtn").textContent="Сохранить изменения";
window.scrollTo({top:0,behavior:"smooth"});
}

async function saveProduct(){
const name=$("name").value.trim();
const rawPrice=$("price").value;
const price=Number(rawPrice);
if(!namerawPrice===""!Number.isFinite(price)||price<0){
msg("status","Укажи название и правильную цену.");
return;
}
const btn=$("saveBtn");
btn.disabled=true;
msg("status","Сохранение...");
try{
const row={
name,price,
variant:$("variant").value.trim()||null,
pack:$("pack").value.trim()||null,
[25.10.2026 9:36] Алишер: category:$("category").value.trim()||null,
note:$("note").value.trim()||null
};
const file=$("photo").files[0];
if(file){
if(file.size>5*1024*1024)throw Error("Фото больше 5 МБ.");
if(!["image/jpeg","image/png","image/webp"].includes(file.type))
throw Error("Неверный формат фото.");
const ext=file.type==="image/jpeg"?"jpg":file.type.split("/")[1];
const path=crypto.randomUUID()+"."+ext;
const {error}=await db.storage.from("product-images").upload(path,file);
if(error)throw error;
row.image_url=path;
}
const result=editing!==null
?await db.from("products").update(row).eq("id",editing)
:await db.from("products").insert(row);
if(result.error)throw result.error;
clearForm();
msg("status","Товар сохранён.");
await loadProducts();
}catch(e){msg("status","Ошибка: "+err(e))}
finally{btn.disabled=false}
}

async function deleteProduct(id){
const p=items.find(x=>String(x.id)===String(id));
if(!p||!confirm("Удалить товар «"+p.name+"»?"))return;
try{
const {error}=await db.from("products").delete().eq("id",id);
if(error)throw error;
await loadProducts();
}catch(e){alert("Ошибка: "+err(e))}
}

async function loadProducts(){
const box=$("products");
box.textContent="Загрузка товаров...";
try{
const {data,error}=await db.from("products")
.select("*").order("name");
if(error)throw error;
items=data||[];
box.replaceChildren();
if(!items.length){box.textContent="Товаров пока нет.";return}
for(const p of items){
const card=document.createElement("div");
card.className="item";
const title=document.createElement("h3");
title.textContent=p.name||"Без названия";
card.append(title);
const info=document.createElement("p");
info.textContent="Цена: "+p.price+" | "+(p.category||"");
card.append(info);
if(p.image_url){
const {data:photo}=await db.storage
.from("product-images").createSignedUrl(p.image_url,3600);
if(photo?.signedUrl){
const img=document.createElement("img");
img.src=photo.signedUrl;
img.alt=p.name;
card.append(img);
}
}
const edit=document.createElement("button");
edit.textContent="Изменить";
edit.onclick=()=>editProduct(p.id);
const del=document.createElement("button");
del.textContent="Удалить";
del.className="danger";
del.onclick=()=>deleteProduct(p.id);
card.append(edit,del);
box.append(card);
}
}catch(e){box.textContent="Ошибка: "+err(e)}
}

async function start(){
try{
if(!window.supabase?.createClient)
throw Error("Библиотека Supabase не загрузилась.");
db=window.supabase.createClient(URL_DB,KEY);
$("loginBtn").onclick=login;
$("logoutBtn").onclick=logout;
$("saveBtn").onclick=saveProduct;
$("cancelBtn").onclick=clearForm;
$("refreshBtn").onclick=loadProducts;
$("password").onkeydown=e=>{if(e.key==="Enter")login()};
const {data,error}=await db.auth.getSession();
if(error)throw error;
show(data.session);
}catch(e){msg("loginStatus","Ошибка запуска: "+err(e))}
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
onload="start()"
onerror="document.getElementById('loginStatus').textContent='Ошибка загрузки Supabase'">
</script>
</body>
</html>
