<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7e9"><title>VITA — Каталог товаров</title>
<style>
:root{--green:#24563e;--dark:#183d2b;--cream:#fbf7e9;--line:#e7dfc8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#202820;font:16px/1.45 Arial,sans-serif}
header{background:#fffdf7;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:3}
.top{max-width:1300px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font: bold 30px Georgia,serif;letter-spacing:2px;color:var(--dark)}.brand small{display:block;font:11px Arial;letter-spacing:1px}
input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:#202820}
button{cursor:pointer}.search{max-width:480px;width:100%;font-size:16px}
main{max-width:1300px;margin:18px auto;padding:0 14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
h1,h2{color:var(--dark)}h1{font-size:26px;margin:6px 0 12px}.muted{font-size:13px;color:#657064}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.product{min-width:0;background:#fffdf7;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 14px #23473412}
.photo{position:relative;width:100%;aspect-ratio:1/1;background:#f5f2e7;border:1px solid #e2d2a7;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain;background:#fffdf8}.photo button{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#fffE;font-size:22px;padding:4px 10px}.photo .prev{left:5px}.photo .next{right:5px}
.product h3{font-size:18px;color:var(--dark);margin:9px 0 4px;overflow-wrap:anywhere}.code{font-size:13px;color:#657064}.price{font-size:23px;font-weight:800;color:var(--dark);margin:7px 0}
.add{width:100%;background:var(--green);color:white;border:0;font-weight:700;min-height:44px}
.cart{position:sticky;top:88px;background:#fffdf7;border:1px solid var(--line);border-radius:16px;padding:15px}.cart h2{margin:0 0 4px;font-size:22px}.cart-item{padding:10px 0;border-bottom:1px solid var(--line)}.cart-item small{display:block;color:#657064}
.qty{display:flex;align-items:center;gap:9px;margin-top:7px}.qty button{width:34px;height:34px;padding:0;background:#e8f0e7;color:var(--dark);font-size:20px}
label{display:block;font-weight:700;font-size:13px;color:var(--dark);margin:10px 0 4px}.form input,.form textarea{width:100%;min-height:44px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin:14px 0}.send{width:100%;min-height:50px;background:#159b52;color:white;border:0;font-weight:800}
.empty{padding:20px;text-align:center;color:#657064}.more{display:block;margin:16px auto;padding:12px 22px;background:var(--green);color:white;border:0}
@media(max-width:950px){.layout{grid-template-columns:1fr}.cart{position:static;order:2}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){header{padding:9px 11px}.top{flex-wrap:wrap}.brand{font-size:27px}.search{max-width:none;order:2}.layout{display:flex;flex-direction:column}.layout>section{width:100%}.grid{grid-template-columns:1fr;gap:12px}.product{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:9px;align-items:center;padding:9px}.photo{grid-column:1;grid-row:1/5}.product h3{font-size:17px;margin:0}.code{font-size:12px}.price{font-size:21px;margin:4px 0}.add{grid-column:2;min-height:42px}.cart{width:100%;order:2}.cart h2{font-size:21px}main{padding:0 10px;margin:12px auto}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head>
<body><header><div class="top"><div class="brand">VITA<small>КАТАЛОГ ТОВАРОВ</small></div><input id="search" class="search" type="search" placeholder="Поиск по названию или коду"></div></header>
<main><div class="layout"><section><h1>Товары</h1><div id="result" class="muted">Загружаем каталог…</div><div id="products" class="grid"></div><button id="more" class="more" hidden>Загрузить ещё</button></section>
<aside class="cart"><h2>Корзина</h2><div id="cartItems" class="empty">Добавьте товары в заказ.</div><div class="form"><label for="shop">Магазин *</label><input id="shop" autocomplete="organization" placeholder="Название магазина"><label for="phone">Телефон *</label><input id="phone" type="tel" autocomplete="tel" placeholder="Номер для связи"><label for="comment">Комментарий</label><textarea id="comment" rows="2" placeholder="Необязательно"></textarea></div><div class="total"><span>Итого</span><strong id="total">0 с.</strong></div><button id="send" class="send">Отправить заказ в WhatsApp</button></aside></div></main>
<script>
(()=>{'use strict';const URL_DB="https://yedkbzasynqitvbavwwd.supabase.co",KEY="sb_publishable_lV5KW7THtDzy-SN9GTrHLg_z7AFMqUP",BUCKET="product-images",WA="992919290585",PAGE=40;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' с.',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,products=[],offset=0,hasMore=true,query='',cart={};
const photos=p=>Array.isArray(p.images)&&p.images.length?p.images:(p.image_url?[p.image_url]:[]);
async function photoUrl(path){if(/^https?:\/\//i.test(path))return path;const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);if(!error&&data?.signedUrl)return data.signedUrl;return db.storage.from(BUCKET).getPublicUrl(path).data?.publicUrl||''}
async function load(reset=false){if(reset){offset=0;products=[];$('products').replaceChildren();hasMore=true}$('more').disabled=true;try{const {data,error}=await db.from('products').select('id,name,price,images,image_url').order('name').range(offset,offset+PAGE-1);if(error)throw error;const batch=data||[];products=reset?batch:[...products,...batch];offset+=batch.length;hasMore=batch.length===PAGE;render();$('more').hidden=!hasMore}catch(e){$('result').textContent='Ошибка загрузки каталога: '+e.message}finally{$('more').disabled=false}}
function render(){const list=products.filter(p=>(String(p.name||'')+' '+String(p.id||'')).toLowerCase().includes(query));$('result').textContent='Товаров загружено: '+products.length;$('products').innerHTML=list.length?list.map(p=>{const imgs=photos(p);return '<article class="product" data-code="'+esc(p.id)+'"><div class="photo">'+(imgs.length?'<img loading="lazy" alt="'+esc(p.name)+'" data-main-photo src="">'+(imgs.length>1?'<button class="prev" data-step="-1" aria-label="Предыдущее фото">‹</button><button class="next" data-step="1" aria-label="Следующее фото">›</button>':''):'<span class="muted">Нет фото</span>')+'</div><h3>'+esc(p.name)+'</h3><div class="code">Код: '+esc(p.id)+'</div><div class="price">'+money(p.price)+'</div><button class="add" data-add="'+esc(p.id)+'">Добавить в заказ</button></article>'}).join(''):'<div class="empty">Ничего не найдено.</div>';
for(const card of $('products').querySelectorAll('.product')){const p=products.find(x=>String(x.id)===card.dataset.code),imgs=photos(p);if(imgs.length){const img=card.querySelector('[data-main-photo]');img.dataset.index='0';photoUrl(imgs[0]).then(url=>{if(url)img.src=url})}}
renderCart()}
function renderCart(){const chosen=products.filter(p=>(cart[p.id]||0)>0);let total=0;$('cartItems').innerHTML=chosen.length?chosen.map(p=>{const q=cart[p.id],sum=q*Number(p.price);total+=sum;return '<div class="cart-item"><b>'+esc(p.name)+'</b><small>Код: '+esc(p.id)+' · '+money(p.price)+'</small><div class="qty"><button data-cart="'+esc(p.id)+'" data-delta="-1">−</button><strong>'+q+'</strong><button data-cart="'+esc(p.id)+'" data-delta="1">+</button><strong style="margin-left:auto">'+money(sum)+'</strong></div></div>'}).join(''):'<div class="empty">Добавьте товары в заказ.</div>';$('total').textContent=money(total)}
function change(code,d){cart[code]=Math.max(0,(cart[code]||0)+d);renderCart()}
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
$('products').addEventListener('click',async e=>{const add=e.target.closest('[data-add]');if(add){change(add.dataset.add,1);return}const nav=e.target.closest('[data-step]');if(nav){const card=nav.closest('.product'),p=products.find(x=>String(x.id)===card.dataset.code),imgs=photos(p),img=card.querySelector('[data-main-photo]');if(!imgs.length)return;const i=(Number(img.dataset.index||0)+Number(nav.dataset.step)+imgs.length)%imgs.length;img.dataset.index=String(i);const url=await photoUrl(imgs[i]);if(url)img.src=url}});
$('cartItems').addEventListener('click',e=>{const b=e.target.closest('[data-cart]');if(b)change(b.dataset.cart,Number(b.dataset.delta))});
$('more').onclick=()=>load(false);
$('send').onclick=()=>{const chosen=products.filter(p=>(cart[p.id]||0)>0);if(!chosen.length){alert('Сначала добавьте товары.');return}const shop=$('shop').value.trim(),phone=$('phone').value.trim();if(!shop||!phone){alert('Введите название магазина и телефон.');return}let total=0,msg='🛍 ЗАКАЗ VITA\n\n🏪 Магазин: '+shop+'\n📞 Телефон: '+phone+'\n\nСОСТАВ ЗАКАЗА:\n';for(const p of chosen){const q=cart[p.id],sum=q*Number(p.price);total+=sum;msg+='• '+p.name+' (код '+p.id+')\n  '+q+' шт. × '+money(p.price)+' = '+money(sum)+'\n'}msg+='\nИТОГО: '+money(total);const comment=$('comment').value.trim();if(comment)msg+='\n\nКомментарий: '+comment;location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};
try{db=window.supabase.createClient(URL_DB,KEY);load(true)}catch(e){$('result').textContent='Ошибка запуска: '+e.message}
})();
</script></body></html>
