<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VITA — каталог</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ec;color:#20352b;font:16px Arial}header{background:#173f32;color:white;padding:24px}main{max-width:950px;margin:24px auto;padding:0 14px}h1{margin:8px 0}.muted{color:#68756d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.panel{background:#fffdf8;border:1px solid #dedfd5;border-radius:14px;padding:16px}.photo{height:90px;background:#edf0e8;border-radius:10px;display:grid;place-items:center}.price{font-size:22px;font-weight:bold;color:#173f32}.controls{display:flex;align-items:center;gap:15px}.controls button,.send{background:#173f32;color:white;border:0;border-radius:9px;padding:10px 16px;font-size:20px;cursor:pointer}input,textarea{width:100%;padding:12px;border:1px solid #dedfd5;border-radius:9px;margin:6px 0 14px;font:inherit}.cartline{padding:10px 0;border-bottom:1px solid #ddd}.send{width:100%;font-size:16px;margin-top:10px}.total{font-size:22px;font-weight:bold;margin:16px 0}
</style></head><body><header><div class="muted" style="color:#dce8dd;letter-spacing:5px">VITA</div><h1>Каталог товаров</h1><div>Выберите товары и отправьте заказ в WhatsApp</div></header><main>
<h2>Товары</h2><input id="search" placeholder="Поиск по названию или коду">
<div id="products" class="grid"></div><section class="panel" style="margin-top:24px"><h2>Ваш заказ</h2><div id="cartItems" class="muted">Корзина пока пуста.</div><div id="total" class="total">Итого: 0</div>
<input id="shop" placeholder="Название магазина *"><input id="phone" placeholder="Телефон для связи *"><textarea id="comment" rows="3" placeholder="Комментарий (необязательно)"></textarea><button id="sendButton" class="send">Отправить заказ в WhatsApp</button></section></main>
<script>
"use strict";
const WHATSAPP_NUMBER="992919290585";
const products=[
{id:"042",name:"Fairy 450 мл",price:11.5,pack:12},
{id:"001",name:"Domestos 750 мл",price:19,pack:16},
{id:"003",name:"Azelit 600 мл",price:18.5,pack:8},
{id:"007",name:"Ариэль 3 кг",price:65,pack:6},
{id:"009",name:"Миф 2 кг",price:37,pack:8},
{id:"008",name:"Персил 3 кг",price:65,pack:6}
];
const cart={};
const money=n=>new Intl.NumberFormat("ru-RU",{style:"currency",currency:"TJS"}).format(n);
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=products.filter(p=>p.name.toLowerCase().includes(q)||p.id.includes(q));
 document.getElementById("products").innerHTML=filtered.length?filtered.map(p=>`
 <article class="card"><div class="photo">📦 Фото скоро</div><h3>${p.name}</h3><p class="muted">Код: ${p.id}</p><p class="muted">В коробке: ${p.pack} шт.</p><div class="price">${money(p.price)}</div><div class="controls"><button data-id="${p.id}" data-delta="-1">−</button><strong>${cart[p.id]||0}</strong><button data-id="${p.id}" data-delta="1">+</button></div></article>`).join(""):'<p>Ничего не найдено.</p>';
 let total=0;const selected=products.filter(p=>(cart[p.id]||0)>0);
 document.getElementById("cartItems").innerHTML=selected.length?selected.map(p=>{const sum=p.price*cart[p.id];total+=sum;return `<div class="cartline"><b>${p.name}</b><br>Код: ${p.id}<br>${cart[p.id]} шт. × ${money(p.price)} = ${money(sum)}</div>`}).join(""):'<p class="muted">Корзина пока пуста.</p>';
 document.getElementById("total").textContent="Итого: "+money(total);
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("products").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b)return;cart[b.dataset.id]=Math.max(0,(cart[b.dataset.id]||0)+Number(b.dataset.delta));render()});
document.getElementById("sendButton").addEventListener("click",()=>{
 const selected=products.filter(p=>(cart[p.id]||0)>0);if(!selected.length){alert("Сначала добавьте товары в корзину.");return}
 const shop=document.getElementById("shop").value.trim(),phone=document.getElementById("phone").value.trim(),comment=document.getElementById("comment").value.trim();
 if(!shop||!phone){alert("Введите название магазина и телефон.");return}
 let total=0,msg="ЗАКАЗ VITA\nМагазин: "+shop+"\nТелефон: "+phone+"\n\n";
 selected.forEach(p=>{const sum=p.price*cart[p.id];total+=sum;msg+=p.name+" (код "+p.id+")\n"+cart[p.id]+" шт. × "+money(p.price)+" = "+money(sum)+"\n\n"});
 msg+="ИТОГО: "+money(total);if(comment)msg+="\nКомментарий: "+comment;
 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
});
render();
</script></body></html>
